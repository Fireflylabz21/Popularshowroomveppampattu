<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TableTap QR — Order Direct</title>
  <style>
    :root {
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --accent: #D97706;
      --accent-dark: #B45309;
      --veg: #15803D;
      --nonveg: #B91C1C;
      --whatsapp: #25D366;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 92px; }
    .container { max-width: 520px; margin: 0 auto; }

    /* Header */
    header { background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .brand-row { display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .table-badge { background: #FEF3C7; color: var(--accent-dark); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid #FDE68A; }
    .sync-status { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10B981; display: inline-block; }

    /* Search & Veg Filter */
    .controls { padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .search-input { flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #F9FAFB; outline: none; }
    .search-input:focus { border-color: var(--accent); background: #FFF; }
    .veg-pill { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; background: #FFF; user-select: none; white-space: nowrap; }
    .veg-pill.active { border-color: var(--veg); background: #F0FDF4; color: var(--veg); }

    /* Sticky Category Tabs */
    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: var(--bg); position: sticky; top: 61px; z-index: 15; scrollbar-width: none; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-tab { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFF; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; cursor: pointer; }
    .cat-tab.active { background: var(--text); color: #FFF; border-color: var(--text); }

    /* Menu Cards */
    .menu-list { padding: 4px 16px 20px; }
    .cat-heading { font-size: 15px; font-weight: 800; margin: 14px 0 8px; color: var(--text); text-transform: uppercase; letter-spacing: 0.04em; }
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .item-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .fssai-box { width: 14px; height: 14px; border: 1.5px solid var(--veg); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; }
    .fssai-box.nonveg { border-color: var(--nonveg); }
    .fssai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--veg); }
    .fssai-box.nonveg .fssai-dot { background: var(--nonveg); border-radius: 1px; }
    .bestseller { font-size: 10px; font-weight: 800; background: #FEF3C7; color: #B45309; padding: 2px 6px; border-radius: 4px; }
    .item-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .item-desc { font-size: 12px; color: var(--muted); line-height: 1.35; margin-bottom: 6px; }
    .item-price { font-size: 14px; font-weight: 800; }

    /* Stepper */
    .stepper { display: flex; align-items: center; border: 1.5px solid var(--accent); border-radius: 10px; overflow: hidden; background: #FFFBEB; min-width: 86px; justify-content: space-between; }
    .add-btn { width: 100%; padding: 7px 14px; border: none; background: transparent; color: var(--accent-dark); font-weight: 800; font-size: 13px; cursor: pointer; }
    .step-btn { width: 28px; height: 32px; border: none; background: transparent; color: var(--accent-dark); font-weight: 800; font-size: 16px; cursor: pointer; }
    .step-qty { font-size: 13px; font-weight: 800; color: var(--text); }

    /* Sticky Bottom Cart Bar */
    .cart-bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 488px; background: var(--text); color: #FFF; padding: 14px 18px; border-radius: 14px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; z-index: 30; }
    .cart-bar.visible { display: flex; }

    /* Checkout Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .sheet { background: #FFF; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-btn { background: #F3F4F6; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: 700; cursor: pointer; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
    .field input[readonly] { background: #F3F4F6; font-weight: 700; color: var(--text); }
    .cart-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    .total-row { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; margin: 14px 0; }
    .wa-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--whatsapp); color: #FFF; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .wa-btn:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand-row">
      <div class="brand-title">Roast &amp; Crumb Café</div>
      <div class="table-badge" id="locationBadge">Dine-In</div>
    </div>
    <div class="sync-status"><span class="dot"></span><span id="syncText">Syncing Live Menu...</span></div>
  </header>

  <div class="controls">
    <input type="search" id="searchInput" class="search-input" placeholder="Search coffee, croissants, bowls..." />
    <div class="veg-pill" id="vegToggle">
      <span class="fssai-box"><span class="fssai-dot"></span></span> Veg Only
    </div>
  </div>

  <div class="cat-bar" id="catBar"></div>
  <div class="menu-list" id="menuList"></div>
</div>

<!-- Sticky Cart Summary -->
<div class="cart-bar" id="cartBar">
  <div>
    <div style="font-size:12px;opacity:.85" id="cartCount">0 Items</div>
    <div style="font-size:16px;font-weight:800" id="cartSubtotal">₹0</div>
  </div>
  <div style="font-weight:800;font-size:14px">Review &amp; Order →</div>
</div>

<!-- Checkout Drawer -->
<div class="modal-backdrop" id="checkoutModal">
  <div class="sheet">
    <div class="sheet-header">
      <h3>Your Order Summary</h3>
      <button class="close-btn" id="closeModal">✕</button>
    </div>

    <div id="checkoutItems"></div>
    <div class="total-row"><span>Total Payable (UPI / Cash at Counter)</span><span id="modalTotal">₹0</span></div>

    <div class="field">
      <label>Order Type</label>
      <select id="orderTypeSelect">
        <option value="Dine-In">Dine-In</option>
        <option value="Takeaway">Takeaway</option>
      </select>
    </div>

    <div class="field" id="tableFieldWrap">
      <label>Table Number</label>
      <input type="text" id="tableInput" placeholder="e.g. Table 04" />
    </div>

    <div class="field">
      <label>Your Name (Optional)</label>
      <input type="text" id="customerName" placeholder="e.g. Aarav" />
    </div>

    <div class="field">
      <label>Kitchen Instructions</label>
      <textarea id="orderNotes" rows="2" placeholder="e.g. Less sugar, oat milk, extra hot..."></textarea>
    </div>

    <button class="wa-btn" id="submitOrderBtn">Send Order on WhatsApp</button>
  </div>
</div>

<script>
  const CONFIG = {
    SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbvVINlu8MjHt3fAY5VO07uAmc0hiyvaFdPSW4I4DKqxdaXmL9Njtl491v8DSVsshGiUGkJvOU258M/pub?gid=0&single=true&output=csv',
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyE3skapxBaFbBhulyX3EXZT-X0gQiy_lVJ_CA2J1hvlCeaGLpUiMjt0bzdz0Pmhu7e/exec',
    CAFE_WHATSAPP: '919444143914'
  };

  // Embedded Offline Fallback Menu
  const FALLBACK_MENU = [
    { id: 1, category: 'Hot Coffee', name: 'Signature Flat White', desc: 'Double ristretto poured over velvety micro-foamed milk.', price: 180, veg: true, bestseller: true, available: true },
    { id: 2, category: 'Hot Coffee', name: 'Spanish Cortado', desc: 'Equal parts bold espresso and textured sweetened milk.', price: 170, veg: true, bestseller: false, available: true },
    { id: 3, category: 'Cold Brews', name: '18-Hr Classic Cold Brew', desc: 'Steeped slow with Chikmagalur single-estate Arabica.', price: 210, veg: true, bestseller: true, available: true },
    { id: 4, category: 'Cold Brews', name: 'Yuzu Espresso Tonic', desc: 'Sparkling tonic, Japanese yuzu citrus, double espresso.', price: 240, veg: true, bestseller: false, available: true },
    { id: 5, category: 'All-Day Bites', name: 'Almond Butter Croissant', desc: 'Flaky French butter pastry baked fresh every morning.', price: 195, veg: true, bestseller: true, available: true },
    { id: 6, category: 'All-Day Bites', name: 'Smoked Chicken Ciabatta', desc: 'Herb-roasted chicken, pesto aioli, aged cheddar on sourdough.', price: 290, veg: false, bestseller: true, available: true }
  ];

  let menuItems = [];
  let cart = {};
  let vegOnly = false;
  let activeCategory = 'All';
  let searchQuery = '';

  // URL Parameter Auto-Detection (?table=04 & ?type=takeaway)
  const params = new URLSearchParams(window.location.search);
  const urlTable = params.get('table');
  const urlType = (params.get('type') || '').toLowerCase();

  const orderTypeSelect = document.getElementById('orderTypeSelect');
  const tableInput = document.getElementById('tableInput');
  const tableFieldWrap = document.getElementById('tableFieldWrap');
  const locationBadge = document.getElementById('locationBadge');

  function initLocationFromURL() {
    if (urlType === 'takeaway') {
      orderTypeSelect.value = 'Takeaway';
      orderTypeSelect.disabled = true;
      tableFieldWrap.style.display = 'none';
      locationBadge.textContent = 'Takeaway Counter';
    } else if (urlTable) {
      orderTypeSelect.value = 'Dine-In';
      orderTypeSelect.disabled = true;
      tableInput.value = `Table ${urlTable.padStart(2, '0')}`;
      tableInput.readOnly = true;
      locationBadge.textContent = `Table ${urlTable.padStart(2, '0')}`;
    } else {
      orderTypeSelect.addEventListener('change', () => {
        tableFieldWrap.style.display = orderTypeSelect.value === 'Takeaway' ? 'none' : 'block';
        locationBadge.textContent = orderTypeSelect.value;
      });
    }
  }

  // RFC-compliant CSV line parser (handles commas inside quoted descriptions)
  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const char = row[i];
      if (char === '"') {
        if (inQuotes && row[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const headers = parseCSVRow(lines[0]).map(h => h.toLowerCase());
    return lines.slice(1).map((line, idx) => {
      const cols = parseCSVRow(line);
      const obj = {};
      headers.forEach((h, i) => {
        let val = (cols[i] || '').trim();
        if (h === 'id') val = Number(val) || (idx + 1);
        if (h === 'price') val = Number(val) || 0;
        if (h === 'veg' || h === 'bestseller' || h === 'available') val = val.toUpperCase() === 'TRUE';
        obj[h] = val;
      });
      return obj;
    });
  }

  async function loadMenu() {
    try {
      const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const csv = await res.text();
      const parsed = parseCSV(csv).filter(item => item.available === true && item.name);
      if (!parsed.length) throw new Error('No available items found in sheet');
      menuItems = parsed;
      document.getElementById('syncText').textContent = 'Live Google Sheet Synced';
    } catch (e) {
      console.warn('Falling back to offline menu:', e);
      menuItems = FALLBACK_MENU.filter(item => item.available === true);
      document.getElementById('syncText').textContent = 'Offline Instant Menu Ready';
    }
    renderCategories();
    renderMenu();
  }

  function renderCategories() {
    const cats = ['All', ...new Set(menuItems.map(i => i.category))];
    const catBar = document.getElementById('catBar');
    catBar.innerHTML = cats.map(c =>
      `<button class="cat-tab ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c.replace(/'/g, "\\'")}')">${c}</button>`
    ).join('');
  }

  window.setCategory = function(cat) {
    activeCategory = cat;
    renderCategories();
    renderMenu();
  };

  function renderMenu() {
    const filtered = menuItems.filter(item => {
      if (vegOnly && !item.veg) return false;
      if (activeCategory !== 'All' && item.category !== activeCategory) return false;
      if (searchQuery && !(`${item.name} ${item.desc}`).toLowerCase().includes(searchQuery)) return false;
      return true;
    });

    const grouped = filtered.reduce((acc, item) => {
      (acc[item.category] = acc[item.category] || []).push(item);
      return acc;
    }, {});

    const menuList = document.getElementById('menuList');
    if (!filtered.length) {
      menuList.innerHTML = `<p style="text-align:center;color:#6B7280;padding:40px 0;">No matching dishes found.</p>`;
      return;
    }

    menuList.innerHTML = Object.entries(grouped).map(([category, items]) => `
      <div class="cat-heading">${category}</div>
      ${items.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="item-card">
            <div>
              <div class="item-meta">
                <span class="fssai-box ${item.veg ? '' : 'nonveg'}"><span class="fssai-dot"></span></span>
                ${item.bestseller ? '<span class="bestseller">★ BESTSELLER</span>' : ''}
              </div>
              <div class="item-name">${item.name}</div>
              <div class="item-desc">${item.desc || ''}</div>
              <div class="item-price">₹${item.price}</div>
            </div>
            <div class="stepper">
              ${qty === 0
                ? `<button class="add-btn" onclick="updateQty(${item.id}, 1)">+ ADD</button>`
                : `<button class="step-btn" onclick="updateQty(${item.id}, -1)">−</button>
                   <span class="step-qty">${qty}</span>
                   <button class="step-btn" onclick="updateQty(${item.id}, 1)">+</button>`}
            </div>
          </div>`;
      }).join('')}
    `).join('');
  }

  window.updateQty = function(id, delta) {
    const next = (cart[id] || 0) + delta;
    if (next <= 0) delete cart[id];
    else cart[id] = next;
    renderMenu();
    updateCartBar();
  };

  function getCartDetails() {
    let count = 0;
    let total = 0;
    const lines = [];
    Object.entries(cart).forEach(([id, qty]) => {
      const item = menuItems.find(m => m.id === Number(id));
      if (item) {
        count += qty;
        total += item.price * qty;
        lines.push({ ...item, qty, lineTotal: item.price * qty });
      }
    });
    return { count, total, lines };
  }

  function updateCartBar() {
    const { count, total } = getCartDetails();
    const bar = document.getElementById('cartBar');
    if (count > 0) {
      bar.classList.add('visible');
      document.getElementById('cartCount').textContent = `${count} Item${count > 1 ? 's' : ''}`;
      document.getElementById('cartSubtotal').textContent = `₹${total}`;
    } else {
      bar.classList.remove('visible');
    }
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderMenu();
  });

  document.getElementById('vegToggle').addEventListener('click', function() {
    vegOnly = !vegOnly;
    this.classList.toggle('active', vegOnly);
    renderMenu();
  });

  document.getElementById('cartBar').addEventListener('click', () => {
    const { total, lines } = getCartDetails();
    document.getElementById('checkoutItems').innerHTML = lines.map(l =>
      `<div class="cart-row"><span>${l.qty} × ${l.name}</span><strong>₹${l.lineTotal}</strong></div>`
    ).join('');
    document.getElementById('modalTotal').textContent = `₹${total}`;
    document.getElementById('checkoutModal').classList.add('open');
  });

  document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('checkoutModal').classList.remove('open');
  });

  // Dual-Channel Order Dispatch (Google Sheet Webhook + WhatsApp Ticket)
  document.getElementById('submitOrderBtn').addEventListener('click', async function() {
    const btn = this;
    const { total, lines } = getCartDetails();
    if (!lines.length) return;

    const orderType = orderTypeSelect.value;
    const tableVal = orderType === 'Takeaway' ? 'Takeaway' : (tableInput.value.trim() || 'Counter');
    const customerName = document.getElementById('customerName').value.trim() || 'Guest';
    const notes = document.getElementById('orderNotes').value.trim() || 'None';
    const itemsFormatted = lines.map(l => `${l.qty}x ${l.name}`).join(', ');

    btn.disabled = true;
    btn.textContent = 'Sending Ticket to Kitchen...';

    let orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);

    // 1. Log to Google Sheet (doPost) using text/plain to avoid CORS preflight
    try {
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          orderType,
          table: tableVal,
          customerName,
          items: itemsFormatted,
          total,
          notes
        })
      });
      const data = await res.json();
      if (data.orderId) orderId = data.orderId;
    } catch (err) {
      console.warn('Webhook redirect handled, proceeding to WhatsApp:', err);
    }

    // 2. Open Pre-Formatted WhatsApp Order Ticket (wa.me)
    const waText = [
      `*NEW ORDER — ${orderId}*`,
      `*Type:* ${orderType} (${tableVal})`,
      `*Customer:* ${customerName}`,
      `------------------------`,
      ...lines.map(l => `• ${l.qty} x ${l.name} — ₹${l.lineTotal}`),
      `------------------------`,
      `*Total: ₹${total}*`,
      `*Notes:* ${notes}`
    ].join('\n');

    const waUrl = `https://wa.me/${CONFIG.CAFE_WHATSAPP}?text=${encodeURIComponent(waText)}`;
    window.open(waUrl, '_blank');

    cart = {};
    updateCartBar();
    renderMenu();
    document.getElementById('checkoutModal').classList.remove('open');
    btn.disabled = false;
    btn.textContent = 'Send Order on WhatsApp';
  });

  initLocationFromURL();
  loadMenu();
</script>
</body>
</html>
